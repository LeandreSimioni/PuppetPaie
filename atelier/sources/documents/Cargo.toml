[package]
name = "documents"
version = "0.1.0"
edition = "2021"
description = "Les documents de PuppetPaie : contrat, avenant, bulletin, certificat Congés Spectacles, AER, questionnaire, bordereau, prélèvement à la source, et la fabrique de PDF ; chacun se fabrique depuis l'engagement validé, aucun ne recalcule."
license = "EUPL-1.2"
publish = false

[dependencies]
socle = { path = "../socle" }
droit = { path = "../droit" }
engagement = { path = "../engagement" }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
# L'empreinte d'une description de PDF (`fabrique.rs`).
sha2 = { workspace = true }
# Le PDF : la description part a la fabrique dans le meme processus.
fabrique-pdf = { path = "../fabrique-pdf" }
