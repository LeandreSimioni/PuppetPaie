
<style>
  :root { --accent:#B22222; --texte:#2C3E50; --fond:#F7F6F4; --carte:#FFFFFF;
          --bord:#DDD8D2; --discret:#7A8794; --logo:#2350c4; }
  * { box-sizing:border-box; }
  html, body { overflow:auto; }   /* taille fixe : une barre de defilement seulement si le texte ne tient pas */
  body { margin:0; height:100vh; display:flex; align-items:center;
         justify-content:center; font:14px/1.5 Arial,Helvetica,sans-serif;
         color:var(--texte); background:var(--fond); }
  .carte { width:380px; padding:28px 32px 26px; background:var(--carte);
           border:1px solid var(--bord); border-radius:6px; }
  .filet { height:3px; background:var(--accent); width:48px; margin-bottom:14px; }
  h1 { margin:0 0 6px; color:var(--logo); }
  h1 svg { display:block; height:48px; width:auto; margin-left:-4px; }
  .sous { color:var(--discret); font-size:12px; margin-bottom:18px; }
  p { margin:0 0 12px; }
  input { width:100%; padding:9px 10px; font:inherit; font-size:15px;
          border:1px solid var(--bord); border-radius:4px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { margin-top:12px; width:100%; padding:9px; font:inherit;
           font-weight:bold; color:#fff; background:var(--accent);
           border:1px solid var(--accent); border-radius:4px; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  button.second { background:#fff; color:var(--texte); border-color:var(--bord); font-weight:normal; }
  .erreur { color:var(--accent); min-height:1.5em; margin-top:8px; }
  .discret { color:var(--discret); font-size:12px; }
  pre { white-space:pre-wrap; font:12px Consolas,monospace; color:var(--discret); }
  .bande { position:fixed; top:0; left:0; right:0; height:36px; }
  .carte { width:100%; max-width:460px; border:0; padding:30px 36px 24px; }
  .croix { position:absolute; top:4px; right:6px; width:34px; height:28px; margin:0;
           padding:0; background:transparent; color:var(--discret); border:0;
           display:flex; align-items:center; justify-content:center; font-size:13px; }
  .croix:hover { background:var(--accent); color:#fff; }
  .retour { position:absolute; top:4px; left:6px; width:auto; height:28px; margin:0; padding:0 10px;
            background:transparent; color:var(--discret); border:0; font-weight:normal; font-size:13px; }
  .retour:hover { background:var(--accent); color:#fff; }
  /* La fenetre a sa vraie barre de titre (Tauri) : la croix de l'ancienne fenetre sans bordure ferait double. */
  .croix { display:none !important; }
</style>

<div class="carte">
  <div class="filet"></div>
  <h1><svg viewBox="64.5 -111.3 657.2 195.4" role="img" aria-label="PuppetPaie"><g fill="currentColor" stroke="currentColor"><g transform="translate(-34.5 -160) scale(0.37)"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M301 146 C298 280 305 450 297 618" stroke-width="30.5"/><path d="M340 170 C420 132 504 196 504 298 C504 398 424 466 338 432" stroke-width="30.5"/><g stroke="none"><circle cx="338" cy="432" r="17"/><circle cx="297" cy="618" r="17"/></g></g></g><g transform="translate(176.5 0) scale(1.08)" fill="none" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"><path transform="rotate(0.63 28 -40)" d="M2 -52 C0 -20 6 -1 22 -1 C36 -1 43 -16 44 -34"/><path transform="rotate(0.63 28 -40)" d="M44 -53 C45 -32 44 -14 46 -1"/><path transform="rotate(-0.83 91 -40)" d="M65 -48.9 C66 -14.9 64 19.1 66 47.1"/><path transform="rotate(-0.83 91 -40)" d="M69 -38.9 C83 -54.9 109 -52.9 109 -25.9 C109 -0.9 85 5.1 69 -6.9"/><path transform="rotate(-1.62 154 -40)" d="M128 -49.3 C129 -15.3 127 18.7 129 46.7"/><path transform="rotate(-1.62 154 -40)" d="M132 -39.3 C146 -55.3 172 -53.3 172 -26.3 C172 -1.3 148 4.7 132 -7.3"/><path transform="rotate(-0.42 215 -40)" d="M193 -26.1 C207 -27.1 219 -27.1 232 -28.1 C234 -45.1 224 -53.1 212 -53.1 C198 -53.1 190 -41.1 190 -25.1 C190 -8.1 200 -0.1 214 -0.1 C224 -0.1 230 -5.1 233 -11.1"/><path transform="rotate(0.69 267 -40)" d="M260 -84.4 C259 -50.4 257 -18.4 262 -4.4 C265 2.6 275 1.6 280 -4.4"/><path transform="rotate(0.69 267 -40)" d="M248 -49.4 C258 -50.4 270 -51.4 280 -51.4"/><path transform="rotate(0.39 329 -40)" d="M303 -48.3 C304 -14.3 302 19.7 304 47.7"/><path transform="rotate(0.39 329 -40)" d="M307 -38.3 C321 -54.3 347 -52.3 347 -25.3 C347 -0.3 323 5.7 307 -6.3"/><path transform="rotate(-1.31 391 -40)" d="M404 -41.4 C399 -51.4 392 -53.4 385 -53.4 C371 -53.4 364 -39.4 364 -25.4 C364 -9.4 373 -0.4 384 -0.4 C396 -0.4 404 -11.4 405 -28.4"/><path transform="rotate(-1.31 391 -40)" d="M406 -53.4 C405 -33.4 406 -15.4 408 -0.4"/><path transform="rotate(0.59 436 -40)" d="M429 -50.9 C428 -32.9 430 -14.9 429 -0.9"/><circle cx="430" cy="-74.93" r="7" stroke="none" fill="currentColor"/><path transform="rotate(-1.85 480 -40)" d="M458 -25.6 C472 -26.6 484 -26.6 497 -27.6 C499 -44.6 489 -52.6 477 -52.6 C463 -52.6 455 -40.6 455 -24.6 C455 -7.6 465 0.4 479 0.4 C489 0.4 495 -4.6 498 -10.6"/></g></g></svg></h1>
  <div class="sous">premi&egrave;re ouverture</div>
  <!-- « Meme administrateur ? » : seulement quand le moteur dit qu'il y a lieu (`administrateur::etat`,
       `question`) -- une compagnie reelle sans mot de passe, et d'autres qui en ont un. -->
  <script type="application/json" id="administrateur">{{ADMINISTRATEUR}}</script>
  <div id="question" hidden>
    <p><b>{{P:meme_administrateur}}</b></p>
    <p class="discret">{{P:ouvre_deja}} <span class="q-noms"></span></p>
    <button id="q-oui" type="button">Oui, le même administrateur</button>
    <button id="q-non" type="button" class="second">{{P:non_a_elle}}</button>
  </div>
  <form id="a" hidden>
    <p>{{P:tapez_pour}} <span class="q-noms"></span> {{P:ouvrira_aussi}}</p>
    <input id="a-mdp" type="password" autocomplete="current-password" placeholder="{{P:mdp_administrateur}}">
    <button id="a-ok" type="submit">Rattacher et ouvrir</button>
    <div class="erreur" id="a-erreur"></div>
  </form>
  <form id="f">
    <p>{{P:choisissez}}</p>
    <input id="mdp" type="password" autocomplete="new-password" autofocus placeholder="six caract&egrave;res au moins">
    <input id="mdp2" type="password" autocomplete="new-password" placeholder="une seconde fois">
    <button id="ok" type="submit">Poser et ouvrir</button>
    <div class="erreur" id="erreur"></div>
  </form>
  <div class="discret">{{P:demande_ouverture}}</div>
</div>
<script>
  const f = document.getElementById("f"), mdp = document.getElementById("mdp"),
        mdp2 = document.getElementById("mdp2"),
        ok = document.getElementById("ok"), err = document.getElementById("erreur");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    ok.disabled = true; err.textContent = "";
    // Le mot de passe se pose par sa route ; la fenêtre ouvre ensuite la compagnie avec lui.
    let r = await appel("mot-de-passe-changer", { nouveau: mdp.value, confirmation: mdp2.value });
    if (r.ok) r = await window.pywebview.api.verifier(mdp.value);
    if (r.ok) { mdp.value = mdp2.value = ""; ok.textContent = "D\u00e9marrage\u2026"; return; }
    err.textContent = r.erreur; ok.disabled = false; mdp.focus();
  });
  // LA QUESTION DE L'ADMINISTRATEUR : oui, son mot de passe tape une fois (le moteur le verifie et rattache) ; non, le
  // choix d'un mot de passe propre, comme pour une premiere compagnie.
  const adm = JSON.parse(document.getElementById("administrateur").textContent || "{}");
  const question = document.getElementById("question"), formeA = document.getElementById("a");
  const enListe = adm.autres_dit || "";
  for (const s of document.querySelectorAll(".q-noms")) s.textContent = enListe;
  if (adm.question) { question.hidden = false; f.hidden = true; }
  document.getElementById("q-non").onclick = () => { question.hidden = true; f.hidden = false; mdp.focus(); };
  document.getElementById("q-oui").onclick = () => {
    question.hidden = true; formeA.hidden = false; document.getElementById("a-mdp").focus();
  };
  formeA.addEventListener("submit", async (e) => {
    e.preventDefault();
    const champ = document.getElementById("a-mdp"), bouton = document.getElementById("a-ok"),
          errA = document.getElementById("a-erreur");
    bouton.disabled = true; errA.textContent = "";
    let r = await appel("administrateur-rattacher", { administrateur: champ.value });
    if (r.ok) r = await window.pywebview.api.verifier(champ.value);
    champ.value = "";
    if (r.ok) { bouton.textContent = "Démarrage…"; return; }
    errA.textContent = r.erreur; bouton.disabled = false; champ.focus();
  });
  window.addEventListener("pywebviewready", () => (adm.question ? document.getElementById("q-oui") : mdp).focus());
  // « Retour » et Echap : revenir au choix de la compagnie. La reponse du geste dit `recharger` et la cale ramene la
  // fenetre sur `/`, ou le serveur sert l'accueil. Un refus s'affiche, rien ne se tait.
  async function retour() {
    const r = await window.pywebview.api.accueil();
    if (!r.ok) err.textContent = r.erreur;
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !e.isComposing && !e.repeat) { e.preventDefault(); retour(); }
  });
</script>

<div class="bande"><button class="retour" title="{{P:retour_choix}}"
  onclick="retour()">&lsaquo; Retour</button><button class="croix" title="Fermer"
  onclick="window.pywebview.api.fermer()">&#x2715;</button></div>
<script>
  // Toute la page se tire (le corps porte la classe de pywebview) -- sauf le
  // champ et les boutons, qui arretent le mousedown avant qu'il n'atteigne
  // le corps, ou pywebview l'ecoute.
  document.body.classList.add("pywebview-drag-region");
  for (const el of document.querySelectorAll("input, button")) {
    el.addEventListener("mousedown", (e) => e.stopPropagation());
  }
</script>
