
<style>
  :root { --accent:#B22222; --texte:#2C3E50; --fond:#F7F6F4; --carte:#FFFFFF;
          --bord:#DDD8D2; --discret:#7A8794; }
  * { box-sizing:border-box; }
  html, body { overflow:hidden; }   /* taille fixe : jamais de barre de defilement */
  body { margin:0; height:100vh; display:flex; align-items:center;
         justify-content:center; font:14px/1.5 Arial,Helvetica,sans-serif;
         color:var(--texte); background:var(--fond); }
  .carte { width:380px; padding:28px 32px 26px; background:var(--carte);
           border:1px solid var(--bord); border-radius:6px; }
  .filet { height:3px; background:var(--accent); width:48px; margin-bottom:14px; }
  h1 { margin:0 0 2px; font-size:20px; }
  .sous { color:var(--discret); font-size:12px; margin-bottom:18px; }
  p { margin:0 0 12px; }
  input { width:100%; padding:9px 10px; font:inherit; font-size:15px;
          border:1px solid var(--bord); border-radius:4px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { margin-top:12px; width:100%; padding:9px; font:inherit;
           font-weight:bold; color:#fff; background:var(--accent);
           border:1px solid var(--accent); border-radius:4px; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  .erreur { color:var(--accent); min-height:1.5em; margin-top:8px; }
  .discret { color:var(--discret); font-size:12px; }
  pre { white-space:pre-wrap; font:12px Consolas,monospace; color:var(--discret); }
  .bande { position:fixed; top:0; left:0; right:0; height:36px; }
  .carte { width:100%; max-width:460px; border:0; padding:30px 36px 24px; }
  .croix { position:absolute; top:4px; right:6px; width:34px; height:28px; margin:0;
           padding:0; background:transparent; color:var(--discret); border:0;
           display:flex; align-items:center; justify-content:center; font-size:13px; }
  .croix:hover { background:var(--accent); color:#fff; }
  /* La fenetre a sa vraie barre de titre (Tauri) : la croix de l'ancienne fenetre sans bordure ferait double. */
  .croix { display:none !important; }
</style>

<style>
  html, body { overflow:auto; }
  body { display:block; height:auto; min-height:100vh; }
  .accueil { max-width:1000px; margin:0 auto; padding:34px 24px 28px; }
  .accueil h1 { font-size:20px; }
  .accueil .sous { margin-bottom:20px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:16px; }
  .tuile { position:relative; background:var(--carte); border:1px solid var(--bord);
           border-radius:4px; overflow:hidden; display:flex; flex-direction:column;
           cursor:pointer; transition:box-shadow .15s, transform .15s; }
  .tuile:hover { box-shadow:0 4px 14px rgba(44,62,80,.14); transform:translateY(-2px); }
  .tete { position:relative; height:100px; display:grid; place-items:center; background:var(--cie); }
  .tuile.fictive .tete { background:repeating-linear-gradient(135deg, #cfe3f2 0 22px, #fff 22px 44px); }
  .medaillon { width:76px; height:76px; border-radius:50%; background:#fff;
               display:grid; place-items:center; overflow:hidden; }
  .medaillon img { width:56px; height:56px; object-fit:contain; }
  .medaillon .initiale { font:bold 30px Georgia, serif; color:var(--texte); }
  .corps { padding:11px 14px 13px; }
  .nom { display:block; font-weight:bold; font-size:15px; line-height:1.3; }
  .lieu { display:block; color:var(--discret); font-size:12.5px; }
  .crayon { position:absolute; right:8px; top:8px; width:28px; height:28px; margin:0; padding:0;
            border-radius:50%; background:rgba(255,255,255,.92); border:0;
            display:grid; place-items:center; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .crayon svg { width:15px; height:15px; }
  .zero { cursor:pointer; }
  .zero:hover { background:#fff; }
  .crayon input { position:absolute; inset:0; width:100%; height:100%; opacity:0;
                  cursor:pointer; border:0; padding:0; }
  .ajouter { border:2px dashed var(--bord); background:transparent; align-items:center;
             justify-content:center; color:var(--discret); min-height:170px; }
  .ajouter:hover { border-color:var(--texte); color:var(--texte); }
  .ajouter .plus { font-size:38px; line-height:1; }
  .ajouter form { display:none; width:85%; }
  .ajouter.saisie .invite { display:none; }
  .ajouter.saisie form { display:block; }
  .ajouter form button { margin-top:8px; }
  .erreur { text-align:center; }
  .fictives { margin-top:26px; }
  /* Au-dessus de la bande qui tire la fenetre : sinon elle prend l'appui. */
  #geste { position:relative; z-index:2; }
  #geste::after { content:""; position:absolute; inset:-9px -4px; }
  .fictives > summary { cursor:pointer; color:var(--discret); font-size:13px;
                        list-style:none; padding:6px 0; margin-bottom:12px;
                        border-top:1px solid var(--bord); padding-top:14px; }
  .fictives > summary::-webkit-details-marker { display:none; }
  .fictives > summary::before { content:"\25B8"; display:inline-block; width:16px;
                                transition:transform .15s; }
  .fictives[open] > summary::before { transform:rotate(90deg); }
  .fictives > summary:hover { color:var(--texte); }
</style>
<div class="accueil">
  <div class="filet" id="geste"></div>
  <h1>PuppetPaie</h1>
  <div class="sous">{{SOUS_TITRE}}</div>
  {{TUILES}}
  <div class="erreur" id="erreur"></div>
</div>
<script>
  const err = document.getElementById("erreur");
  for (const t of document.querySelectorAll(".tuile[data-id]")) {
    // La reponse se lit (#141) : une compagnie qui ne s'ouvre pas le dit, au lieu de ne rien faire.
    t.addEventListener("click", async () => {
      const r = await window.pywebview.api.choisir(t.dataset.id);
      err.textContent = r && r.ok ? "" : (r && r.erreur) || "La compagnie ne s'ouvre pas.";
    });
  }
  for (const c of document.querySelectorAll(".crayon input")) {
    const tuile = c.closest(".tuile");
    c.addEventListener("click", (e) => e.stopPropagation());
    c.addEventListener("input", () => tuile.style.setProperty("--cie", c.value));
    c.addEventListener("change", async () => {
      const r = await window.pywebview.api.couleur(tuile.dataset.id, c.value);
      err.textContent = r.ok ? "" : r.erreur;
    });
  }
  for (const z of document.querySelectorAll(".zero")) {
    const tuile = z.closest(".tuile");
    z.addEventListener("click", async (e) => {
      e.stopPropagation();
      const nom = tuile.querySelector(".nom").textContent;
      if (!confirm("Remettre « " + nom + " » à zéro ?\n\nTout ce qui a été fait "
                   + "dans cette compagnie de démonstration sera effacé.")) return;
      const r = await window.pywebview.api.remettre_a_zero(tuile.dataset.id);
      err.textContent = r.ok ? r.message : r.erreur;
    });
  }
  // LE GESTE (l'editeur, 02/10/2026) : cinq secondes d'appui sur le filet
  // rouge, au-dessus du nom, basculent entre la demo et le complet. Rien ne
  // le montre, et rien ne bouge pendant l'appui.
  const geste = document.getElementById("geste");
  let minuterie = null;
  const lacher = () => { clearTimeout(minuterie); minuterie = null; };
  geste.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    lacher();
    minuterie = setTimeout(async () => {
      minuterie = null;
      const r = await window.pywebview.api.basculer();
      if (!r.ok) err.textContent = r.erreur;
    }, 5000);
  });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) geste.addEventListener(ev, lacher);
  // Et l'appui ne tire pas la fenetre (pywebview ecoute le mousedown du corps).
  geste.addEventListener("mousedown", (e) => e.stopPropagation());
  const ajout = document.querySelector(".ajouter");
  if (ajout) {
    const nom = ajout.querySelector("input");
    ajout.addEventListener("click", () => { ajout.classList.add("saisie"); nom.focus(); });
    ajout.querySelector("form").addEventListener("submit", async (e) => {
      e.preventDefault(); e.stopPropagation();
      const r = await window.pywebview.api.ajouter(nom.value);
      err.textContent = r.ok ? "" : r.erreur;
    });
  }
</script>

<div class="bande"><button class="croix" title="Fermer"
  onclick="window.pywebview.api.fermer()">&#x2715;</button></div>
<script>
  // Toute la page se tire (le corps porte la classe de pywebview) -- sauf le
  // champ et les boutons, qui arretent le mousedown avant qu'il n'atteigne
  // le corps, ou pywebview l'ecoute.
  document.body.classList.add("pywebview-drag-region");
  for (const el of document.querySelectorAll("input, button")) {
    el.addEventListener("mousedown", (e) => e.stopPropagation());
  }
</script>
