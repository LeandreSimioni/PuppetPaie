
<style>
  :root { --accent:#B22222; --texte:#2C3E50; --fond:#F7F6F4; --carte:#FFFFFF;
          --bord:#DDD8D2; --discret:#7A8794; }
  * { box-sizing:border-box; }
  html, body { overflow:hidden; }   /* taille fixe : jamais de barre de defilement */
  body { margin:0; height:100vh; display:flex; align-items:center;
         justify-content:center; font:14px/1.5 Arial,Helvetica,sans-serif;
         color:var(--texte); background:var(--fond); }
  .carte { width:380px; padding:28px 32px 26px; background:var(--carte);
           border:1px solid var(--bord); border-radius:6px; }
  .filet { height:3px; background:var(--accent); width:48px; margin-bottom:14px; }
  h1 { margin:0 0 2px; font-size:20px; }
  .sous { color:var(--discret); font-size:12px; margin-bottom:18px; }
  p { margin:0 0 12px; }
  input { width:100%; padding:9px 10px; font:inherit; font-size:15px;
          border:1px solid var(--bord); border-radius:4px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { margin-top:12px; width:100%; padding:9px; font:inherit;
           font-weight:bold; color:#fff; background:var(--accent);
           border:1px solid var(--accent); border-radius:4px; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  .erreur { color:var(--accent); min-height:1.5em; margin-top:8px; }
  .discret { color:var(--discret); font-size:12px; }
  pre { white-space:pre-wrap; font:12px Consolas,monospace; color:var(--discret); }
  .bande { position:fixed; top:0; left:0; right:0; height:36px; }
  .carte { width:100%; max-width:460px; border:0; padding:30px 36px 24px; }
  .croix { position:absolute; top:4px; right:6px; width:34px; height:28px; margin:0;
           padding:0; background:transparent; color:var(--discret); border:0;
           display:flex; align-items:center; justify-content:center; font-size:13px; }
  .croix:hover { background:var(--accent); color:#fff; }
  /* La fenetre a sa vraie barre de titre (Tauri) : la croix de l'ancienne fenetre sans bordure ferait double. */
  .croix { display:none !important; }
</style>

<style>
  html, body { overflow:auto; }
  body { display:block; height:auto; min-height:100vh; }
  .accueil { max-width:1000px; margin:0 auto; padding:34px 24px 28px; }
  .accueil h1 { font-size:20px; }
  .accueil .sous { margin-bottom:20px; }
  .accueil .version { color:var(--discret); font-size:11px; margin:0 0 2px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:16px; }
  .tuile { position:relative; background:var(--carte); border:1px solid var(--bord);
           border-radius:4px; overflow:hidden; display:flex; flex-direction:column;
           cursor:pointer; transition:box-shadow .15s, transform .15s; }
  .tuile:hover { box-shadow:0 4px 14px rgba(44,62,80,.14); transform:translateY(-2px); }
  .tete { position:relative; height:100px; display:grid; place-items:center; background:var(--cie); }
  .tuile.fictive .tete { background:repeating-linear-gradient(135deg, #cfe3f2 0 22px, #fff 22px 44px); }
  .medaillon { width:76px; height:76px; border-radius:50%; background:#fff;
               display:grid; place-items:center; overflow:hidden; }
  .medaillon img { width:56px; height:56px; object-fit:contain; }
  .medaillon .initiale { font:bold 30px Georgia, serif; color:var(--texte); }
  .corps { padding:11px 14px 13px; }
  .nom { display:block; font-weight:bold; font-size:15px; line-height:1.3; }
  .lieu { display:block; color:var(--discret); font-size:12.5px; }
  .crayon { position:absolute; right:8px; top:8px; width:28px; height:28px; margin:0; padding:0;
            border-radius:50%; background:rgba(255,255,255,.92); border:0;
            display:grid; place-items:center; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .crayon svg { width:15px; height:15px; }
  .zero { cursor:pointer; }
  .zero:hover { background:#fff; }
  .crayon input { position:absolute; inset:0; width:100%; height:100%; opacity:0;
                  cursor:pointer; border:0; padding:0; }
  .ajouter { border:2px dashed var(--bord); background:transparent; align-items:center;
             justify-content:center; color:var(--discret); min-height:170px; }
  .ajouter:hover { border-color:var(--texte); color:var(--texte); }
  .ajouter .plus { font-size:38px; line-height:1; }
  .ajouter form { display:none; width:85%; }
  .ajouter.saisie .invite { display:none; }
  .ajouter.saisie form { display:block; }
  .ajouter form button { margin-top:8px; }
  .erreur { text-align:center; }
  .fictives { margin-top:26px; }
  /* Au-dessus de la bande qui tire la fenetre : sinon elle prend l'appui. */
  #geste { position:relative; z-index:2; }
  #geste::after { content:""; position:absolute; inset:-9px -4px; }
  .fictives > summary { cursor:pointer; color:var(--discret); font-size:13px;
                        list-style:none; padding:6px 0; margin-bottom:12px;
                        border-top:1px solid var(--bord); padding-top:14px; }
  .fictives > summary::-webkit-details-marker { display:none; }
  .fictives > summary::before { content:"\25B8"; display:inline-block; width:16px;
                                transition:transform .15s; }
  .fictives[open] > summary::before { transform:rotate(90deg); }
  .fictives > summary:hover { color:var(--texte); }
</style>
<style>
  /* LE TABLEAU DE BORD DE L'ADMINISTRATEUR (ticket #244) : les declarations de ses compagnies, la plus pressee d'abord. */
  .tableau { margin:0 0 26px; }
  .tableau h2 { font-size:15px; margin:0 0 4px; }
  .tableau .intro { color:var(--discret); font-size:12.5px; margin:0 0 10px; }
  .declarations { background:var(--carte); border:1px solid var(--bord); border-radius:4px; }
  .declaration { display:grid; grid-template-columns:170px 1fr 190px; gap:12px; align-items:baseline;
                 padding:9px 14px; border-top:1px solid var(--bord); cursor:pointer; }
  .declaration:first-child { border-top:0; }
  .declaration:hover { background:#FBFAF8; }
  .declaration .cie { font-weight:bold; font-size:13px; display:flex; gap:7px; align-items:center; }
  .declaration .cie::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--cie, var(--accent)); flex:none; }
  .declaration .quoi b { display:block; font-size:13.5px; }
  .declaration .quoi span { color:var(--discret); font-size:12.5px; }
  .declaration .limite { text-align:right; font-size:12.5px; }
  .declaration.retard .limite { color:var(--accent); font-weight:bold; }
  .declaration .pastille { display:inline-block; font-size:11px; padding:1px 7px; border-radius:9px;
                           background:#EEF5EA; color:#3B6D2E; margin-left:6px; }
  .declaration .pastille.test { background:#E8F0F7; color:#2E5A7D; }
  .declaration ul { margin:4px 0 0 16px; padding:0; color:var(--discret); font-size:12px; }
  .tableau .vide { color:var(--discret); padding:12px 14px; }
  .tableau .groupe { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .tableau .groupe button { width:auto; margin:0; padding:8px 14px; }
  .tableau .groupe button.second { background:#fff; color:var(--texte); border-color:var(--bord); font-weight:normal; }
  .tableau .resultats { margin-top:10px; font-size:13px; }
  .tableau .resultats li { margin:3px 0; }
  .tableau .resultats .refus { color:var(--accent); }
  .boite-mdp { position:fixed; inset:0; background:rgba(44,62,80,.35); display:grid; place-items:center; z-index:5; }
  .boite-mdp form { background:#fff; padding:22px 26px; border-radius:6px; width:380px; }
  .boite-mdp .barre { display:flex; gap:8px; }
  .boite-mdp .barre button.second { background:#fff; color:var(--texte); border-color:var(--bord); font-weight:normal; }
</style>
<link rel="stylesheet" href="/mise-a-jour.css?v={{EMPREINTE}}">
<div class="accueil">
  <div class="filet" id="geste"></div>
  <h1>PuppetPaie</h1>
  <!-- La version, sous le nom, comme dans la page d'une compagnie (ticket #211). -->
  <div class="version">version {{VERSION}}</div>
  <div class="sous">{{SOUS_TITRE}}</div>
  <section class="tableau" id="tableau" hidden></section>
  {{TUILES}}
  <div class="erreur" id="erreur"></div>
</div>
<script>
  const err = document.getElementById("erreur");
  for (const t of document.querySelectorAll(".tuile[data-id]")) {
    // La reponse se lit (#141) : une compagnie qui ne s'ouvre pas le dit, au lieu de ne rien faire.
    t.addEventListener("click", async () => {
      const r = await window.pywebview.api.choisir(t.dataset.id);
      err.textContent = r && r.ok ? "" : (r && r.erreur) || "La compagnie ne s'ouvre pas.";
    });
  }
  for (const c of document.querySelectorAll(".crayon input")) {
    const tuile = c.closest(".tuile");
    c.addEventListener("click", (e) => e.stopPropagation());
    c.addEventListener("input", () => tuile.style.setProperty("--cie", c.value));
    c.addEventListener("change", async () => {
      const r = await window.pywebview.api.couleur(tuile.dataset.id, c.value);
      err.textContent = r.ok ? "" : r.erreur;
    });
  }
  for (const z of document.querySelectorAll(".zero")) {
    const tuile = z.closest(".tuile");
    z.addEventListener("click", async (e) => {
      e.stopPropagation();
      const nom = tuile.querySelector(".nom").textContent;
      if (!confirm("Remettre « " + nom + " » à zéro ?\n\nTout ce qui a été fait "
                   + "dans cette compagnie fictive sera effacé.")) return;
      const r = await window.pywebview.api.remettre_a_zero(tuile.dataset.id);
      err.textContent = r.ok ? r.message : r.erreur;
    });
  }
  // LE GESTE (l'editeur, 02/10/2026) : cinq secondes d'appui sur le filet
  // rouge, au-dessus du nom, brident ou débloquent le logiciel. Rien ne
  // le montre, et rien ne bouge pendant l'appui.
  const geste = document.getElementById("geste");
  let minuterie = null;
  const lacher = () => { clearTimeout(minuterie); minuterie = null; };
  geste.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    lacher();
    minuterie = setTimeout(async () => {
      minuterie = null;
      const r = await window.pywebview.api.basculer();
      if (!r.ok) err.textContent = r.erreur;
    }, 5000);
  });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) geste.addEventListener(ev, lacher);
  // Et l'appui ne tire pas la fenetre (pywebview ecoute le mousedown du corps).
  geste.addEventListener("mousedown", (e) => e.stopPropagation());
  const ajout = document.querySelector(".ajouter");
  if (ajout) {
    const nom = ajout.querySelector("input");
    ajout.addEventListener("click", () => { ajout.classList.add("saisie"); nom.focus(); });
    ajout.querySelector("form").addEventListener("submit", async (e) => {
      e.preventDefault(); e.stopPropagation();
      const r = await window.pywebview.api.ajouter(nom.value);
      err.textContent = r.ok ? "" : r.erreur;
    });
  }
</script>
<script>
  /* LE TABLEAU DE BORD DE L'ADMINISTRATEUR (ticket #244). Tout vient du moteur (`administrateur.rs`) : les declarations
     de ses compagnies, triees par urgence avec leur date limite, ce qui est pret, et s'il y a lieu de proposer le depot
     groupe (`groupe.*.propose` : au moins deux compagnies avec quelque chose de pret). La page affiche, elle ne decide
     rien. D'abord le tableau garde (tout de suite), puis refait en fond. */
  (function () {
    const zone = document.getElementById("tableau");
    // La fenetre se tire par son corps : le tableau n'en est pas une poignee.
    zone.addEventListener("mousedown", (e) => e.stopPropagation());
    const api = window.pywebview.api;
    const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let dernier = null, resultats = "";
    const pluriel = (n, un, des) => (n > 1 ? des : un);

    function ligne(d) {
      const pret = d.pret || {};
      const pastille = pret.reel ? `<span class="pastille">prête à envoyer</span>`
        : pret.test ? `<span class="pastille test">prête pour le test</span>` : "";
      const ou = (d.ou || []).length ? `<ul>${d.ou.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
      return `<div class="declaration${d.en_retard ? " retard" : ""}" data-id="${esc(d.id)}" style="--cie:${esc(d.couleur)}">
        <span class="cie">${esc(d.compagnie)}</span>
        <span class="quoi"><b>${esc(d.titre)}${pastille}</b><span>${esc(d.marche || d.detail || "")}</span>${ou}</span>
        <span class="limite">${d.quand ? (d.en_retard ? "en retard — c'était " : "au plus tard ") + esc(d.quand) : ""}</span>
      </div>`;
    }

    function dessiner(t) {
      dernier = t;
      if (!t || !(t.compagnies || []).length) { zone.hidden = true; return; }
      zone.hidden = false;
      const decl = t.declarations || [];
      const noms = t.compagnies.map((c) => c.nom);
      // Une compagnie dont le tableau ne se fait pas le dit, avec la phrase du moteur (pas avant qu'il ait ete refait).
      const pannes = t.garde ? [] : t.compagnies.filter((c) => c.erreur);
      const g = t.groupe || {};
      const boutons = [];
      if (g.reel && g.reel.propose) boutons.push(`<button type="button" id="g-reel">Déposer les ${g.reel.declarations} DSN prêtes</button>`);
      if (g.test && g.test.propose) boutons.push(`<button type="button" class="second" id="g-test">Tester les ${g.test.declarations} DSN écrites</button>`);
      zone.innerHTML = `
        <h2>Les déclarations de vos compagnies</h2>
        <p class="intro">${esc(noms.join(" · "))} — un seul mot de passe, celui de l'administrateur.</p>
        <div class="declarations">${decl.length ? decl.map(ligne).join("")
          : pannes.length ? "" : `<div class="vide">Toutes les déclarations de vos compagnies sont faites.</div>`}
          ${pannes.map((c) => `<div class="declaration retard" data-id="${esc(c.id)}" style="--cie:${esc(c.couleur)}">
            <span class="cie">${esc(c.nom)}</span><span class="quoi"><b>Le tableau de cette compagnie ne se lit pas</b>
            <span>${esc(c.erreur)}</span></span><span class="limite"></span></div>`).join("")}</div>
        ${boutons.length ? `<div class="groupe">${boutons.join("")}</div>` : ""}
        <div class="resultats">${resultats}</div>`;
      for (const l of zone.querySelectorAll(".declaration[data-id]")) {
        l.addEventListener("click", async () => {
          const r = await api.choisir(l.dataset.id);
          if (!r || !r.ok) err.textContent = (r && r.erreur) || "La compagnie ne s'ouvre pas.";
        });
      }
      const reel = document.getElementById("g-reel"), test = document.getElementById("g-test");
      if (reel) reel.onclick = () => demanderMotDePasse(g.reel.declarations, (m) => deposer(true, m, reel));
      if (test) test.onclick = () => deposer(false, "", test);
    }

    /* Le mot de passe de l'administrateur, tape au moment de l'acte : il ouvre chaque coffre, et chaque depot le
       reverifie. Annuler ne fait rien. */
    function demanderMotDePasse(n, suite) {
      const b = document.createElement("div");
      b.className = "boite-mdp";
      b.innerHTML = `<form><p><b>Déposer ${n} DSN pour de vrai</b></p>
        <p class="discret">Chaque DSN part avec ses contrôles et son bilan, compagnie par compagnie. Le mot de passe de
          l'administrateur le confirme.</p>
        <input type="password" autocomplete="current-password" placeholder="le mot de passe de l'administrateur">
        <div class="barre"><button type="button" class="second">Annuler</button><button type="submit">Déposer</button></div></form>`;
      document.body.appendChild(b);
      const champ = b.querySelector("input");
      champ.focus();
      b.querySelector("button.second").onclick = () => b.remove();
      b.querySelector("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const m = champ.value;
        b.remove();
        if (m) suite(m);
      });
    }

    async function deposer(reel, motdepasse, bouton) {
      bouton.disabled = true;
      bouton.textContent = reel ? "Dépôts en cours…" : "Tests en cours…";
      const r = await api.deposer_groupe(reel, motdepasse);
      if (!r || !r.ok) {
        resultats = `<p class="refus">${esc((r && r.erreur) || "Rien n'est parti.")}</p>`;
        dessiner(dernier);
        return;
      }
      const d = r.depot;
      resultats = `<p><b>${d.partis} ${pluriel(d.partis, "déclaration partie", "déclarations parties")}${d.refuses ? `, ${d.refuses} ${pluriel(d.refuses, "refusée", "refusées")}` : ""}.</b></p>
        <ul>${(d.resultats || []).map((x) => `<li class="${x.parti ? "" : "refus"}"><b>${esc(x.compagnie)}</b>${x.titre ? " — " + esc(x.titre) : ""} :
          ${esc(x.parti ? x.phrase : x.refus)}</li>`).join("")}</ul>`;
      dessiner(d.tableau);
    }

    (async () => {
      if (typeof api.tableau !== "function") return;
      const r = await api.tableau();
      if (r && r.ok) dessiner(r.tableau);
      if (!r || !r.ok || !(r.tableau.compagnies || []).length) return;
      const frais = await api.tableau_rafraichir();
      if (frais && frais.ok) dessiner(frais.tableau);
    })();
  })();
</script>
<!-- L'indicateur de la mise a jour, en bas a gauche (ticket #210). -->
<script src="/js/mise-a-jour.js?v={{EMPREINTE}}"></script>

<div class="bande"><button class="croix" title="Fermer"
  onclick="window.pywebview.api.fermer()">&#x2715;</button></div>
<script>
  // Toute la page se tire (le corps porte la classe de pywebview) -- sauf le
  // champ et les boutons, qui arretent le mousedown avant qu'il n'atteigne
  // le corps, ou pywebview l'ecoute.
  document.body.classList.add("pywebview-drag-region");
  for (const el of document.querySelectorAll("input, button")) {
    el.addEventListener("mousedown", (e) => e.stopPropagation());
  }
</script>
