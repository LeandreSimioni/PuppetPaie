# L'espace Cargo du moteur : une crate par partie, chaque flèche descend.
#
#     paie          la ligne de commande `moteur` et les parties du dessus (interface, compagnie, import, atelier) ;
#                   choisit le branchement des envois, ouvre le coffre, note les incidents
#     envois        ce qui part et revient (net-entreprises, DPAE, signature, courriel, Drive, retours et bilans) et le
#                   journal de ce qui est parti ; recoit des pieces fabriquees et un mot de passe, ne fabrique rien,
#                   n'ouvre jamais le coffre
#     declarations  ce qu'un engagement validé fait déclarer (DSN mensuelle et signalements, DPAE, régularisations,
#                   bloc 44, CSA, OETH, CASC-SVP, et la norme qui les contrôle : usages, formats, natures, champs) ;
#                   les états de ce qu'une DSN a porté ; ne recalcule rien
#     documents     ce qu'un engagement validé fait imprimer, signer ou envoyer (contrat, avenant, bulletin, certificat
#                   Congés Spectacles, AER, questionnaire, récapitulatif annuel, bordereau, prélèvement, états de paie,
#                   du personnel et de comptabilité, plan comptable, numéros des pièces, fabrique de PDF) ; ne
#                   recalcule rien
#     engagement    la saisie, le calcul de ses paies, la validation, le recalcul ; lit ce qui est parti ; ne fabrique
#                   aucun document
#     droit         barèmes datés, conventions, natures de contrat, règles ; lit tout à une date ; ne connaît pas
#                   l'engagement
#     socle         dates, heure de Paris, temps simulé, nombres, texte, HTML et base64, fichiers, échecs, garde-fou
#                   réseau
#
# `declarations` prend à `documents` (le bordereau, le bulletin, le certificat que la DSN reprend), jamais l'inverse.
# `envois` prend à `declarations` et à `documents` ce qui part ; l'engagement ne lit pas le journal, `moteur` lui passe
# ce qui est parti.
#
# La fenêtre (`fenetre/`) et la fabrique de PDF (`fabrique-pdf/`) gardent chacune leur verrou et leurs profils : elles ne
# sont pas de l'espace (la fenêtre prend `moteur` par son chemin).

[workspace]
members = ["socle", "droit", "engagement", "documents", "declarations", "envois", "moteur"]
exclude = ["fenetre", "fabrique-pdf"]
resolver = "2"

[workspace.dependencies]
# Arithmetique decimale : ROUND_HALF_UP = MidpointAwayFromZero.
rust_decimal = { version = "1", default-features = false, features = ["std", "maths"] }
# Les fichiers se lisent en serde_json::Value : les cles inconnues et `_commentaires` survivent sans schema a maintenir.
# `float_roundtrip` : un flottant lu est exactement celui qui est ecrit, et `num::dec` passe par sa representation la
# plus courte.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
roxmltree = { version = "0.20", default-features = false, features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# « unwind », pas « abort » (ticket #244) : la fenetre sert les routes du moteur dans son processus ; une route qui
# tombe (une panique) doit rendre un refus `DefautDuLogiciel` et laisser la fenetre debout (`routes::dans_la_fenetre`,
# `catch_unwind`).
panic = "unwind"
strip = true

# scrypt brasse 32 Mo par essai : le code des briques de chiffrement va vite,
# le reste du binaire reste petit.
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

# Les tests (profil dev) derivent des cles scrypt par dizaines (le mot de passe du logiciel, les demandes de `demande.rs`) :
# ces briques-la, optimisees, les font passer de minutes a secondes.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Le profil des ESSAIS (`cargo nextest run --cargo-profile essais`) : le code optimise de `release`, sans le LTO ni
# l'unite de compilation unique, qui se repaient pour chacun des binaires de `tests/`. L'exe livre (`release`) ne change pas.
[profile.essais]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
panic = "unwind"
[profile.essais.package."*"]
opt-level = 2
[profile.essais.package.scrypt]
opt-level = 3
[profile.essais.package.salsa20]
opt-level = 3
[profile.essais.package.pbkdf2]
opt-level = 3
[profile.essais.package.sha2]
opt-level = 3
