[package]
name = "fabrique-pdf"
version = "1.0.0"
edition = "2021"
description = "La fabrique de PDF de PuppetPaie : lit une description JSON (FORMAT.md) et écrit le PDF."
license = "EUPL-1.2"
publish = false

[[bin]]
name = "fabrique-pdf"
path = "src/main.rs"

[dependencies]
genpdfi = { path = "genpdfi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Décompression des polices de métriques embarquées (voir build.rs).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# L'assemblage du dossier (src/assemblage.rs) et la relecture des PDF dans les tests : même version
# et mêmes fonctionnalités que celle que printpdf embarque déjà, donc pas une copie de plus.
lopdf = { version = "0.31", default-features = false, features = ["pom_parser"] }

# Les largeurs de Liberation, pour l'extraction de texte (déjà là via genpdfi : pas une copie de plus).
ttf-parser = "0.24"
# AES-256 (chiffrement PDF 2.0, `--verrouiller`) : de petites briques sans dépendance lourde.
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
sha2 = "0.10"
getrandom = "0.2"
# Le formulaire (src/formulaire.rs) : un SVG posé dans une page existante (usvg + svg2pdf, son
# texte mis en tracés avec Liberation), un PNG ou un JPEG lu par `image`. Mêmes versions que celles
# que printpdf embarque déjà : pas une copie de plus.
usvg = { version = "0.35", default-features = false, features = ["text"] }
svg2pdf = "0.8"
pdf-writer = "0.9"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
