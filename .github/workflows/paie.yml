# LE MOTEUR RUST, COMPILE POUR LES TROIS SYSTEMES : un seul programme, `paie`,
# qui calcule, fait les bulletins et sert la fabrique de PDF (`paie pdf ...`).
#
# Le poste de l'editeur n'a pas d'editeur de liens (PORTAGE-RUST.md §0) : il
# ne compile pas le Rust, il recoit le programme tout fait. Ce travail le
# fabrique pour Windows, Mac (Intel et Apple, un seul fichier) et Linux, fait
# passer `cargo test` de la fabrique sur chacun, puis COMMITE LES TROIS
# PROGRAMMES dans `atelier/sources/paie/bin/<systeme>/`, SUR LA BRANCHE OU ON LE
# LANCE. Ils arrivent chez l'editeur par Git, chez une compagnie par la mise a
# jour : rien a installer. Un push fait avec GITHUB_TOKEN ne relance rien.

name: Moteur Rust

on:
  # A LA MAIN SEULEMENT (Leandre, 01/10/2026) : une fois, avant de
  # fusionner. Mac compte dix fois, Windows deux.
  #
  # MAC REACTIVE (Leandre, 14/10/2026 : « on devrait pouvoir faire tout le
  # Mac, le Windows et le Linux depuis le depot public ») : sur le depot
  # public, les minutes sont gratuites. Le moteur `paie` se construit pour les
  # trois systemes ; la fenetre (Tauri) seulement pour Windows et Linux, le
  # Mac de la fenetre reste a faire. NE PAS LE LANCER DEPUIS LE DEPOT PRIVE
  # (Mac y compte dix fois, Windows deux).
  workflow_dispatch:

concurrency:
  group: paie-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: atelier/sources/paie

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: paie-windows
          - os: ubuntu-latest
            nom: paie-linux
          - os: macos-latest
            nom: paie-mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Chaine Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cibles Mac (Intel et Apple)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # Les tests de la fabrique ; ceux du moteur relisent les demos et les
      # paies du poste, et se lancent dans le conteneur.
      - name: Tests de la fabrique
        working-directory: atelier/sources/fabrique-pdf
        run: cargo test --release --locked

      - name: Construire (Windows, Linux)
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      # Un seul fichier pour les deux sortes de Mac : l'editeur n'a pas a
      # savoir quel processeur a le sien.
      - name: Construire (Mac universel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/paie \
            target/x86_64-apple-darwin/release/paie \
            target/aarch64-apple-darwin/release/paie

      - name: Verifier le numero du format
        shell: bash
        run: |
          ./target/release/paie pdf --version
          test "$(./target/release/paie pdf --version)" = "fabrique-pdf 3"

      # LA FENETRE (lot J5) : le binaire `puppetpaie`, Tauri. Linux demande WebKitGTK pour la construire ; Windows a
      # WebView2 d'office.
      - name: Bibliotheques de la fenetre (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      - name: Construire la fenetre
        if: runner.os != 'macOS'
        working-directory: atelier/sources/fenetre
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: |
            atelier/sources/paie/target/release/paie
            atelier/sources/paie/target/release/paie.exe
            atelier/sources/fenetre/target/release/puppetpaie
            atelier/sources/fenetre/target/release/puppetpaie.exe
          if-no-files-found: error

  # Les trois programmes, rassembles et commites sur la branche.
  livrer:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Poser les programmes dans bin/
        run: |
          B=atelier/sources/paie/bin
          mkdir -p $B/windows $B/linux $B/mac
          cp artefacts/paie-windows/paie/target/release/paie.exe $B/windows/
          cp artefacts/paie-windows/fenetre/target/release/puppetpaie.exe $B/windows/
          cp artefacts/paie-linux/paie/target/release/paie $B/linux/
          cp artefacts/paie-linux/fenetre/target/release/puppetpaie $B/linux/
          cp artefacts/paie-mac/paie/target/release/paie $B/mac/
          chmod +x $B/linux/paie $B/linux/puppetpaie $B/mac/paie
          # L'empreinte des sources compilees (le moteur et la fabrique qu'il
          # embarque) : `tests.yml` la compare a celle de la branche.
          git ls-tree HEAD atelier/sources/paie/ atelier/sources/fabrique-pdf/ | grep -v "	atelier/sources/paie/bin$" | sha256sum | cut -c1-64 > $B/SOURCES
          git add $B
          git update-index --chmod=+x $B/linux/paie $B/linux/puppetpaie $B/mac/paie
          ls -l $B/*/

      - name: Commiter s'ils ont change
        run: |
          if git diff --cached --quiet; then
            echo "Programmes inchanges : rien a commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Moteur Rust : programmes compiles pour Windows, Linux et Mac (${GITHUB_SHA::8})"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
