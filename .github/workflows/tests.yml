# TOUS LES TESTS, LANCES AILLEURS QUE SUR LE POSTE QUI DEPOSE.
#
# La suite du moteur : `cargo nextest run` dans l'espace `atelier/sources/` : le socle, le droit, l'engagement et le moteur (puis la suite de l'atelier,
# dans sa cible). Elle tourne sur les compagnies
# fictives et sur leur copie figee
# (`paie/tests/donnees/fictives/`), jamais sur `prive/`.
#
# ROUGE = ON NE FUSIONNE PAS.

name: Tests

# A LA MAIN SEULEMENT. La suite passe dans le conteneur avant chaque PR ; ici,
# elle ne tourne que lancee a la main (onglet Actions). Le depot est public :
# les minutes sont illimitees, ce n'est pas une question de quota (15/10/2026).
on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  paie:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atelier/sources
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Les deux cibles : celle de la suite livree et celle de la suite de l'atelier (sinon elle se recompile a froid).
          workspaces: |
            atelier/sources
            atelier/sources -> target-atelier
      # nextest en binaire precompile : rien a compiler, aucune minute de plus.
      - uses: taiki-e/install-action@nextest
      - name: Lancer la suite du moteur
        run: cargo nextest run --cargo-profile essais --locked --no-fail-fast
      # Dans sa propre cible : `--features atelier` recompile toute la caisse (atelier/CLAUDE.md, « Les tests »).
      - name: Lancer la suite de l'atelier
        run: cargo nextest run --cargo-profile essais --locked -p paie --features atelier --target-dir target-atelier --lib --test atelier --test fichiers -E 'test(/(^|::)atelier::/)'
